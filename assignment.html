<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="assignmentstyle.css">
</head>
<body>
    <nav>
        <h1>Employee Management System</h1>
    </nav>

 <div class="main-block">
    <div class="form-container">
    <form>
        <div class="block">
            <label for="name">Employee Name</label> <br>
        <input type="text" name="name" id="name" placeholder="Enter Name"></input>
        </div>
        <div class="block">
            <label for="age">Employee Age</label> <br>
        <input type="number" name="age" id="age" placeholder="Enter age"></input>
        </div>

        <div class="block">
            <label for="role">Role</label>  <br>
            <select name="" id="select">
                <option value="frontend">FrontEnd</option>
                <option value="backend">BackEnd</option>
                <option value="fullstack">FullStack</option>
            </select>
        </div>
        <div class="block">
            <label for="salary">Employee Salary</label>
        <input type="number" name="salary" id="salary" placeholder="Enter Salary"></input>
        </div>

        <div class="savebutton">
            <button class="btn" onclick="saveEmployee()" >Save Employee</button>
        </div>
    </form>

    
</div>
 </div>

<div class="savebutton">
            <button class="btn" onclick="showEmployee()" >Show Employee</button>
        </div>

    <div class="table-data">
        <table>
        <thead>
            <tr>
                <td>Name</td>
                <td>Age</td>
                <td>Role</td>
                <td>Salary</td>
                <td>Actions</td>
            </tr>
        </thead>

        <tbody id ="tableBody"></tbody>
    </table>
    </div>

    <script >

var employeeData=[];
let update = false;
function saveEmployee(){
    console.log("calling")
    let name = document.getElementById('name').value;
    let age = document.getElementById('age').value;
    let role = document.getElementById('select').value;
    let salary = document.getElementById('salary').value;
    
    let data= {
        name,
        age,
        role,
        salary
    };
    localStorage.setItem("data",JSON.stringify(data));
    employeeData.push(data);
    console.log(employeeData)
     
    localStorage.setItem("AllData",JSON.stringify(employeeData));
}

function showEmployee(){
   let employeedata = JSON.parse(localStorage.getItem("AllData"));

            let tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; 
            for (let i in employeedata) {

                let d = employeedata[i];

                let row = `
                    <tr>
                        <td>${d.name}</td>
                        <td>${d.age}</td>
                        <td>${d.role}</td>
                        <td>${d.salary}</td>
                        <td><button onclick="update(${d})">Edit</button><button onclick="deleteitem(${d})">Delete</button></td>
                    </tr>
                `;

                tableBody.innerHTML += row;
            }
}
function deleteitem(name){
    console.log(name)
    let data = JSON.parse(localStorage.getItem("AllData"));
    for (let i in data) {

                let d = data[i];

                if(d.name === name){
                    localStorage.removeItem(d)
                    employeeData.pop(d)
                }
            }
}


function updateitem(update){
    console.log(update)
    let data = JSON.parse(localStorage.getItem("AllData"));
    for (let i in data) {

                let d = data[i];

                if(d.name === update){
                    document.getElementById(name).innerHTML =d.name;
                    document.getElementById(age).innerHTML =d.age;
                    document.getElementById(role).innerHTML =d.role;
                    document.getElementById(salary).innerHTML =d.salary;
                }
            }
}
    </script>
</body>
</html>
